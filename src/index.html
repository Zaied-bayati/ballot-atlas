<title>Ballot Atlas: nonpartisan 2026 ballot guide by state</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/*STYLES*/
</style>

<div class="app">
<div class="space" id="space" aria-hidden="true">
  <canvas class="stars"></canvas>
  <canvas class="stars twinkle"></canvas>
  <canvas class="stars twinkle"></canvas>
</div>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#" id="brand-home" aria-label="Ballot Atlas, back to the globe">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#d9c592" stroke-width="1.6"/><path d="M2.5 16h27M16 2.5c4 3.8 6 8.3 6 13.5s-2 9.7-6 13.5M16 2.5c-4 3.8-6 8.3-6 13.5s2 9.7 6 13.5" fill="none" stroke="#d9c592" stroke-width="1.1" opacity=".55"/><path d="M10.5 16.5l3.6 3.6 7.6-8" fill="none" stroke="#f6f3ea" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Ballot Atlas</span>
    </a>
    <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
    <span class="countdown" id="countdown"></span>
  </div>
</header>

<main class="layout">
  <section class="map-wrap" aria-label="Globe">
    <div class="map-frame" id="map-frame">
      <svg id="map" role="img" tabindex="0" aria-label="Globe centered on the United States. Select a state." aria-describedby="map-hint"></svg>
      <div class="map-tip" id="tip" hidden></div>
      <button class="map-back" id="map-back" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="map-back-label">All states</span>
      </button>
      <div class="map-controls" role="group" aria-label="Globe controls">
        <button type="button" id="zoom-in" aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button type="button" id="zoom-out" aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button type="button" id="recenter" aria-label="Recenter on the selection"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
      <div class="map-hint" id="map-hint">Drag to spin · scroll or pinch to zoom · tap a state</div>
    </div>
  </section>

  <div class="panel-shell">
    <aside class="panel" id="panel" aria-live="polite" tabindex="-1"></aside>
  </div>
</main>
</div>

<dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
  <div class="drawer-inner" id="drawer-body"></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script type="application/json" id="globe-lite">/*LITE*/</script>
<script type="application/json" id="us-topo">/*TOPO*/</script>
<script type="application/json" id="ballot-data">/*DATA*/</script>
<script>
/*APP*/
</script>
