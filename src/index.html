<style>
/*STYLES*/
</style>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#" id="brand-home" aria-label="Ballot Atlas, back to the national map">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 12l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Ballot Atlas</span>
    </a>
    <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
  </div>
</header>

<div class="sample-ribbon" role="note">
  <div class="ribbon-inner">
    <strong>Pilot: Texas, November 3, 2026.</strong>
    Researched October 22 from news coverage and county election offices. Always confirm with your county elections office before you vote.
  </div>
</div>

<main class="layout">
  <section class="map-wrap" aria-label="Map">
    <div class="map-frame">
      <svg id="map" viewBox="0 0 975 610" role="img" aria-label="Map of the United States. Select a state."></svg>
      <div class="map-tip" id="tip" hidden></div>
      <div class="map-legend" id="legend"></div>
      <button class="map-back" id="map-back" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="map-back-label">All states</span>
      </button>
    </div>
  </section>

  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
  <div class="drawer-inner" id="drawer-body"></div>
</dialog>
