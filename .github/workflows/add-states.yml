name: Add states

# Builds the statewide ballot for new states, profiles their candidates, and publishes.
on:
  workflow_dispatch:
    inputs:
      states:
        description: "Two-letter state codes, comma-separated (e.g. FL,GA)"
        required: true
      scope:
        description: "top = U.S. Senate and governor only; all = every statewide race and measure"
        default: "top"
      profiles:
        description: "Most candidates to profile in this run"
        default: "60"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build state ballots
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node agent/ballot.mjs --states "${{ github.event.inputs.states }}" --scope "${{ github.event.inputs.scope }}"
      - name: Profile their candidates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEARCH_MAX: ${{ github.event.inputs.profiles }}
          RESEARCH_STATES: ${{ github.event.inputs.states }}
        run: node agent/research.mjs
      - run: node build.js
      - name: Save updates
        if: always()
        run: |
          git config user.name "ballot-atlas-research"
          git config user.email "ballot-atlas-research@users.noreply.github.com"
          git add data dist
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Add states: ${{ github.event.inputs.states }}"
          git push

  publish:
    needs: add
    uses: ./.github/workflows/deploy-site.yml
